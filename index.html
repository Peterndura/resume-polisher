<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free AI Resume Bullet Point Polisher</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #555; font-size: 0.95rem; }
    textarea { width: 100%; height: 110px; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
    button { background: #0066cc; color: #fff; border: none; padding: 14px 20px; font-size: 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
    button:disabled { background: #999; }
    #output { margin-top: 25px; padding: 15px; background: #f8f9fa; border: 1px solid #e2e8f0; border-radius: 8px; white-space: pre-wrap; display: none; }
  </style>
</head>
<body>
  <h1>AI Resume Bullet Polisher</h1>
  <p>Paste a weak bullet point from your resume to generate 3 high-impact alternatives.</p>
  
  <textarea id="input" placeholder="e.g., Managed a team of 4 people and answered emails"></textarea>
  <button id="btn" onclick="polishBullet()">Polish Bullet Point</button>

  <div id="output"></div>

  <script>
    async function polishBullet() {
      const input = document.getElementById('input').value;
      const btn = document.getElementById('btn');
      const output = document.getElementById('output');

      if (!input.trim()) return alert('Please enter a bullet point first.');

      btn.disabled = true;
      btn.innerText = 'Polishing...';
      output.style.display = 'none';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bullet: input })
        });
        const data = await res.json();

        if (res.ok) {
          output.innerText = data.result;
          output.style.display = 'block';
        } else {
          alert('Error: ' + (data.error || 'Something went wrong.'));
        }
      } catch (err) {
        alert('Failed to connect to the server.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Polish Bullet Point';
      }
    }
  </script>
</body>
</html>
